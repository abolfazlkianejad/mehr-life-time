<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Applied before the bundle loads so the first paint already has the
      // stored language direction (no RTL/LTR flash). Keep the storage key in
      // sync with `LANGUAGE_STORAGE_KEY` in src/i18n/config.ts.
      ;(function () {
        try {
          var stored = window.localStorage.getItem('app-language')
          var lang = stored === 'en' || stored === 'fa' ? stored : 'fa'
          document.documentElement.lang = lang
          document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr'
        } catch (error) {
          // localStorage unavailable; the static fa/rtl default stands.
        }
      })()
    </script>
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/favicon.svg"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/favicon_light.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/images/favicon.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/images/favicon_light.png"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <title>Mehr Life OS</title>
    <meta name="title" content="Mehr Life OS" />
    <meta
      name="description"
      content="Mehr Life OS — a bilingual (Persian/English) offline-first personal life and work operating system."
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
