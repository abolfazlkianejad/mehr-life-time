name: Continuous Integration

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Check i18n catalogs
        run: npm run check:i18n

      - name: Check formatting
        run: npm run format:check

      - name: Install Playwright browser
        run: npm run test:browser:install

      - name: Run unit tests
        run: npm test

      - name: Build for production
        run: npm run build

      - name: Run production smoke test
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ > /dev/null
          npm run test:smoke -- http://127.0.0.1:4173
