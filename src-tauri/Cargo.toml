[package]
name = "mehr-life-os"
version = "1.0.7"
description = "Mehr Life OS — offline-first personal life and work operating system"
authors = ["Mehr Life OS"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "mehr_life_os_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
